monolog:
    channels:
        - deprecation # Symfony deprecations log channel

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # Affiche aussi les logs dans le terminal (php bin/console server:run)
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@prod:
    monolog:
        handlers:
            # En prod, on garde tous les logs en mémoire
            # et on les flushe SEULEMENT si une erreur (>= ERROR) survient.
            # → fichier de log compact, contient le contexte complet de chaque erreur.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 7    # garde 7 jours de logs, supprime automatiquement les plus vieux
                formatter: monolog.formatter.json
            # Deprecations Symfony loggees a part (utile pour preparer les upgrades)
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
                max_files: 7

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
