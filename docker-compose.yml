# ─────────────────────────────────────────
# Variables d'environnement partagées entre
# les services php et migrate (YAML anchor)
# ─────────────────────────────────────────
x-php-env: &php-env
  APP_ENV: dev
  APP_SECRET: ${APP_SECRET}
  DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=mariadb-11.0.0&charset=utf8mb4"
  # JWT — clés générées automatiquement par l'entrypoint au premier démarrage
  JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
  JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
  JWT_PASSPHRASE: ""
  # Email Brevo
  MAILER_DSN: "smtp://${BREVO_CONNEXION}:${BREVO_KEY_SMTP}@${BREVO_HOST}:${BREVO_PORT}"
  BREVO_FROM: ${BREVO_FROM}
  # CORS — $$ = $ littéral dans Docker Compose
  CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
  # URLs
  DEFAULT_URI: "http://localhost:8000"
  FRONTEND_URL: "http://localhost:5173"
  # OAuth Google
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: "http://localhost:8000/api/oauth/google/callback"
  FRONTEND_SSO_SUCCESS_URL: "http://localhost:5173/profil"
  FRONTEND_SSO_ERROR_URL: "http://localhost:5173/connexion"
  # API INSEE (validation SIREN)
  INSEE_TOKEN: ${INSEE_TOKEN}
  # API WI-LINE
  WILINE_SERVER: ${WILINE_SERVER}
  WILINE_USER: ${WILINE_USER}
  code: ${WILINE_CODE}

services:

  # ─────────────────────────────────────────
  # BASE DE DONNÉES — MariaDB
  # ─────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: laundrymap_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - laundrymap
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MIGRATIONS — Service one-shot
  # S'exécute une fois, applique les migrations
  # puis s'arrête. Le service php attend sa fin.
  # ─────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundrymap_migrate
    restart: "no"
    # Supprime le cache dev (peut contenir des fichiers temporaires Windows incompatibles Linux)
    # puis applique les migrations
    command: sh -c "rm -rf /var/www/html/var/cache/dev && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console doctrine:fixtures:load --no-interaction"
    environment:
      <<: *php-env
    volumes:
      - ./backend:/var/www/html
      - php_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laundrymap

  # ─────────────────────────────────────────
  # BACKEND — Symfony (PHP 8.4-FPM)
  # ─────────────────────────────────────────
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundrymap_php
    restart: unless-stopped
    environment:
      <<: *php-env
    volumes:
      - ./backend:/var/www/html
      - php_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "9000"
    networks:
      - laundrymap

  # ─────────────────────────────────────────
  # REVERSE PROXY — Nginx
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: laundrymap_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - laundrymap

  # ─────────────────────────────────────────
  # FRONTEND — React + Vite (dev avec HMR)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laundrymap_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    networks:
      - laundrymap

  # ─────────────────────────────────────────
  # PHPMYADMIN
  # ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laundrymap_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laundrymap

# ─────────────────────────────────────────
# VOLUMES & NETWORKS
# ─────────────────────────────────────────
volumes:
  db_data:
  php_vendor:

networks:
  laundrymap:
    driver: bridge
